<style>
/* Visual layer: humanitarian case-management look. UNHCR-inspired blues, warm orange for the cost of error,
   soft rounded surfaces. Content and logic are unchanged. */
:root{
  --paper:#e3eaf3;--sheet:#ffffff;--ink:#0f2742;--ink-2:#45586f;--rule:#c9d5e3;--rule-2:#dfe6ef;--hdr:#f1f5fa;--strong:#18375f;
  --accent:#0072bc;--accent-strong:#005b97;--accent-soft:#e2eefa;--on-accent:#ffffff;
  --warn:#c9461a;--warn-soft:#fdeee6;--ok:#00806a;--ok-soft:#ddf3ee;
  --lite:#7a8ba1;--lite-soft:#eef2f7;--old:#6c4f9a;--old-soft:#f1ecf8;--sun:#ffc740;
  --navy:#18375f;--navy-2:#0f2a4b;
  --shadow:0 1px 2px rgba(22,48,79,.05),0 6px 20px rgba(22,48,79,.07);
  --shadow-sm:0 1px 2px rgba(22,48,79,.06);
  --f-display:"Lato","Helvetica Neue",Arial,sans-serif;--f-body:"Lato","Helvetica Neue",Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0a1320;--sheet:#132234;--ink:#f0f5fb;--ink-2:#aebfd2;--rule:#2d4560;--rule-2:#203449;--hdr:#1a2d44;--strong:#2b4c78;
  --accent:#4ea8ec;--accent-strong:#7cc0f2;--accent-soft:#12304d;--on-accent:#06192b;
  --warn:#f08a5d;--warn-soft:#3b2318;--ok:#3ec6a6;--ok-soft:#0f342d;--lite:#9cb0c7;--lite-soft:#1a2b40;--old:#b79be3;--old-soft:#271f3d;
  --navy:#0a1626;--navy-2:#07111e;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--shadow-sm:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1320;--sheet:#132234;--ink:#f0f5fb;--ink-2:#aebfd2;--rule:#2d4560;--rule-2:#203449;--hdr:#1a2d44;--strong:#2b4c78;
  --accent:#4ea8ec;--accent-strong:#7cc0f2;--accent-soft:#12304d;--on-accent:#06192b;
  --warn:#f08a5d;--warn-soft:#3b2318;--ok:#3ec6a6;--ok-soft:#0f342d;--lite:#9cb0c7;--lite-soft:#1a2b40;--old:#b79be3;--old-soft:#271f3d;
  --navy:#0a1626;--navy-2:#07111e;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--shadow-sm:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:clamp(12px,2.5vw,32px);padding-block:16px 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.005em;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(26px,3.2vw,34px);font-weight:900;line-height:1.15}
h2{font-size:22px;font-weight:900}
h3{font-size:16.5px;font-weight:700}
p{margin:0}
b{font-weight:700}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.kicker{font-family:var(--f-body);font-weight:700;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.banner{font-size:13px;color:var(--ink-2);border:1px dashed var(--rule);border-radius:12px;padding:8px 12px;background:var(--sheet)}

/* app bar */
.appbar{display:flex;justify-content:space-between;align-items:center;gap:14px 20px;flex-wrap:wrap;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);border-radius:20px;padding:12px 14px 12px 18px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand svg,.brand .logo{width:38px;height:38px;flex:none;display:block;border-radius:10px}
.wordmark{font:900 21px/1 var(--f-display);letter-spacing:-.01em;color:#fff}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:6px 4px 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:rgba(255,255,255,.08);padding:4px;border-radius:14px}
.tab{appearance:none;border:none;background:transparent;color:#d4e2f2;padding:9px 15px;border-radius:11px;font:700 14px var(--f-body);cursor:pointer;transition:background .15s,color .15s}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab[aria-selected="true"]{box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tab[aria-selected="true"].old{background:#8b6cc0;color:#fff}
.tab[aria-selected="true"].new{background:#0072bc;color:#fff}
.tab[aria-selected="true"].int{background:#00866f;color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tab:focus-visible{outline-color:var(--sun)}

/* queue */
.queue{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-inline:4px}
.queue:empty{display:none}
.queue .kicker{margin-right:4px}
.qi{appearance:none;cursor:pointer;font:500 12.5px var(--f-mono);border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 12px;color:var(--ink-2);transition:border-color .15s,background .15s;box-shadow:var(--shadow-sm)}
.qi:hover{border-color:var(--accent)}
.qi.cur{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.qi.done{background:var(--ok-soft);color:var(--ok);border-color:transparent;box-shadow:none}
.qi.done::before{content:"✓ ";font-weight:700}
.qi.done.cur{background:var(--ok);color:var(--on-accent)}

/* surfaces */
.panel{background:var(--sheet);border:1px solid var(--rule-2);border-radius:20px;padding:22px clamp(16px,2.4vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.casehead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:7px;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.b-full{background:var(--accent);color:var(--on-accent)}
.b-lite{background:var(--lite-soft);color:var(--ink);border:1px solid var(--rule)}
.b-lite::before{background:var(--lite)}
.b-old{background:var(--old-soft);color:var(--old)}
.triggers{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid #f3d8a0;background:#fff6df;color:#7a5200}
.chip::before{content:"!";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#e8a400;color:#fff;font-size:10.5px;font-weight:900}
.chip.w{border-color:transparent;color:var(--warn);background:var(--warn-soft)}

/* table */

td label.small{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink-2)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0}

.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}

.btn:hover:not(:disabled){background:var(--accent-strong)}

.anchors{display:flex;flex-wrap:wrap;gap:6px}

.two>*{min-width:0}
.box{background:var(--paper);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}

.warnbox{background:var(--warn-soft);border-left:4px solid var(--warn);padding:12px 16px;border-radius:4px 14px 14px 4px;font-size:14.5px}

.oldreason{font-size:14.5px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.oldreason>div{background:var(--old-soft);border-radius:12px;padding:10px 14px}

.oldreason b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--old);margin-bottom:2px}

.iv-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}

/* ---- contrast & hierarchy pass ---- */
.panel{border:1px solid var(--rule)}
section.panel:not(.lite):not(.old):not(.int){border-top:5px solid var(--accent)}
section.panel.lite{border-top:5px solid var(--lite)}
section.panel.old{border-top:5px solid var(--old)}
section.panel.int{border-top:5px solid var(--ok)}
.live .panel{border-top:1px solid var(--rule)}
.fact{border:1px solid var(--rule-2)}
.panel>.step+.step,.panel>.step+.stmt,.panel>.stmt+.answer,.panel>.answer+.step{margin-top:6px}
/* every step gets a header strip: input steps neutral */
.step{border:1px solid var(--rule);padding:16px 20px 18px;gap:14px;box-shadow:var(--shadow-sm)}
.step>.step-h:first-child{margin:-16px -20px 2px;padding:12px 20px;background:var(--hdr);border-bottom:1px solid var(--rule);border-radius:15px 15px 0 0}
.step h3{font-size:17px;font-weight:900}
/* decision steps: solid coloured header */
.step.key{border:2px solid var(--accent);box-shadow:0 0 0 5px var(--accent-soft),var(--shadow);background:var(--sheet)}
.step.key>.step-h:first-child{background:var(--accent);border-bottom:none;margin:-16px -20px 4px;border-radius:13px 13px 0 0}
.step.key>.step-h h3{color:var(--on-accent)}

.int .step.key{border-color:var(--ok);box-shadow:0 0 0 5px var(--ok-soft),var(--shadow);background:var(--sheet)}
.int .step.key>.step-h:first-child{background:var(--ok)}
.int .step.key>.step-h .step-n{color:var(--ok)}
/* result step (calculated outcome): dark header */
.step:has(.outcome){border:2px solid var(--strong)}
.step:has(.outcome)>.step-h:first-child{background:var(--strong);border-bottom:none;border-radius:13px 13px 0 0}

function rankIn(month,s,orig){const L=MONTHS[month].scores.slice();const ix=L.findIndex(x=>Math.abs(x-orig)<0.02);if(ix>=0)L.splice(ix,1);return 1+L.filter(x=>x>s+1e-9).length;}
function cutOf(month){const m=MONTHS[month];return m.scores[m.k-1];}
function outcome(c,lvIdx){
  const sc=score(lvIdx).final;
  if(c.adm) return {code:'ex',txt:'Not eligible',why:'negative administrative check ('+c.adm+')',s:sc,rank:null};
  const r=rankIn(c.month,sc,c.final), k=MONTHS[c.month].k;
  if(sc<TARGET) return {code:'ex',txt:'Not eligible',why:'below the targeting threshold (need)',s:sc,rank:r};
  if(r<=k) return {code:'in',txt:'Eligible',why:"ranked within the month's places",s:sc,rank:r};
  return {code:'wl',txt:'Waiting list',why:"need recognised, but beyond the month's places",s:sc,rank:r};
}
function fragile(c,lvIdx){
  if(c.adm) return [];
  const base=outcome(c,lvIdx).code, out=[];
  lvIdx.forEach((i,j)=>[i-1,i+1].forEach(t=>{if(t<0||t>=FACT[j].lv.length)return;const l2=lvIdx.slice();l2[j]=t;const o=outcome(c,l2);
    if(o.code!==base) out.push(FACT[j].k+' '+(t>i?'one level more severe':'one level less severe')+' → '+o.txt.toLowerCase());}));
  return out;
}

function triggers(c){
  const t=[], o=outcome(c,c.recIdx), s=score(c.recIdx).final;
  if(fragile(c,c.recIdx).length) t.push({t:'Fragile decision'});
  if(!c.spanish && c.recIdx[1]===0) t.push({t:'Inconsistent data: nobody speaks Spanish, "no barrier"'});
  if(c.n===1 && c.recIdx[7]>=2) t.push({t:'Inconsistent data: single person with dependants'});
  if(gapOf(c.guess,c.recIdx)!==0) t.push({t:'Interviewer disagrees: estimate '+c.guess+', Scorecard '+band(score(c.recIdx).final)});
  if(c.raise) t.push({t:'"To review" (interviewer)'});
  if(c.adm) t.push({t:'Negative administrative check'});
  if(o.code!=='in' && ['High','Severe'].includes(band(s))) t.push({t:'Exclusion in band '+band(s),w:true});
  return t;
}

function bindNew(c,o){

  const g=id=>document.getElementById(id);
  if(g('raise')) g('raise').onclick=()=>{st.escalated=true;st.raised=true;renderNew();};
  if(g('reveal')) g('reveal').onclick=()=>{st.stage=2;st.preAt=performance.now();renderNew();};
  if(g('escalate')) g('escalate').onclick=()=>{st.escalated=true;st.stage=1;st.pre=null;renderNew();};

  if(g('switch')) g('switch').onclick=()=>finishB(c,o,o.code,'switched to calculation: '+st.why);
}
function anchorCoherence(c,dec){
  // coherent if the cited factors are above the minimum level when including, or at the minimum level when excluding.
  // Only scored where the direction is clear: inclusion (vulnerability factors present) or exclusion for low need (factors absent).
  // Waiting list and administrative exclusions depend on budget and rules, not on the factors.
  const fa=[...st.anchors].filter(x=>typeof x==='number'); if(!fa.length||dec==='wl'||(dec==='ex'&&c.adm)) return null;
  const ok=fa.filter(j=>dec==='in'?st.lv[j]>0:st.lv[j]===0).length;
  return ok/fa.length;
}
function finishB(c,o,final,how){

    flags:[...st.flags].map(j=>FACT[j].k),corrected:[...st.flags].filter(j=>st.lv[j]!==c.recIdx[j]).map(j=>FACT[j].k+': '+FACT[j].lab[c.recIdx[j]]+' → '+FACT[j].lab[st.lv[j]]),
    anchors:[...st.anchors].map(x=>typeof x==='number'?FACT[x].k:x),coherence:anchorCoherence(c,final),ref:c.ref.code,secs:Math.round((performance.now()-t0)/1000)};
  cur.B++; render();
}

  <div class="stmt"><b class="kicker" style="color:var(--old)">Reasoning process · Safeguards</b>
    <p><b>How was the analysis done?</b> The most important data from each form were collected; more weight was given to factors indicating greater vulnerability; each case was compared with the others; the information was checked and compared with the interviewer's opinion.</p>
    <p><b>Transparency:</b> clear information from the standard forms is used. <b>Responsibility:</b> "A person reviews and makes the final decision, not the AI". <b>Accountability:</b> the AI only helps analyse the information according to the given rules.</p>
    <p class="small muted">Shortened version of the panel shown to the "statements" group (Annex II of the brief).</p></div>
  <div class="answer"><div><span class="kicker">Cashy score</span><div class="big">${fmt(c.old.score)}</div></div><div><span class="kicker">Band</span><div class="big">${band(c.old.score)}</div></div><div><span class="kicker">Recommendation</span><div class="big" style="color:var(--old)">${c.old.rec==='in'?'INCLUDE':'EXCLUDE'}</div></div></div>
  <div class="step"><div class="step-h"><span class="step-n">3</span><h3>How correct is the recommendation? (1–5)</h3></div>
    <div class="rate">${[1,2,3,4,5].map(v=>`<button class="choice" data-rate="${v}" aria-pressed="${st.rating===v}">${v}</button>`).join('')}</div></div>
  <div class="step"><div class="step-h"><span class="step-n">4</span><h3>Do you accept or override the recommendation?</h3></div>
    <div class="choices"><button class="btn old" id="acc" ${st.rating?'':'disabled'}>Accept: ${c.old.rec==='in'?'include':'exclude'}</button><button class="btn sec" id="ovr" ${st.rating?'':'disabled'}>Override: ${c.old.rec==='in'?'exclude':'include'}</button></div></div>
  </section>`;
  app.innerHTML=html;
  app.querySelectorAll('[data-rate]').forEach(el=>el.onclick=()=>{st.rating=+el.dataset.rate;renderOld();});
  const fin=(acc)=>{const fd=acc?c.old.rec:(c.old.rec==='in'?'ex':'in');LOG.A[c.id]={id:c.id,suggested:c.old.rec,rating:st.rating,final:fd,accepted:acc,ref:c.ref.code,secs:Math.round((performance.now()-t0)/1000)};cur.A++;render();};
  document.getElementById('acc').onclick=()=>fin(true);
  document.getElementById('ovr').onclick=()=>fin(false);
}

function renderDone(){
  app.innerHTML=`<section class="panel"><h2>Queue complete</h2><p>You have reviewed all cases in mode ${mode==='A'?'A (current Cashy)':'B (two-track review)'}.</p>
  <div class="choices"><button class="btn" id="go-other">Try the other mode</button><button class="btn sec" id="redo">Restart this mode</button></div></section>`;
  document.getElementById('go-other').onclick=()=>setMode(mode==='A'?'B':'A');
  document.getElementById('redo').onclick=()=>{LOG[mode]={};cur[mode]=0;render();};
}


// ---------- interviewer ----------
const esc=t=>String(t).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
let IV=null;
function ivNew(example){return example?{month:'2024-01',n:4,head:'man',solo:'no',spanish:false,lv:[0,0,0,0,1,3,2,1],adm:{int:false,dup:false,asylum:false},
  note:"Family of four. No adult speaks Spanish: they cannot make themselves understood at the clinic or at school. They sleep in a night-only shelter; during the day the children beg with their mother.",
  guess:null,reason:'',raise:false,stage:'form',t0:performance.now(),seen:new Set(),resolved:new Set(),example:true}
 :{month:'2023-12',n:1,head:'—',solo:'—',spanish:true,lv:[0,0,0,0,0,0,0,0],adm:{int:false,dup:false,asylum:false},note:'',guess:null,reason:'',raise:false,stage:'form',t0:performance.now(),seen:new Set(),resolved:new Set(),example:false};}
function ivChecks(v){const out=[];
  if(!v.spanish&&v.lv[1]===0) out.push({id:'lang',t:'No adult speaks Spanish, but "Language" is recorded as <b>no barrier</b>. Ask the household in which language they can use services.'});
  if(v.n===1&&v.lv[7]>=2) out.push({id:'dep',t:'Single person with a <b>dependency</b> burden. Are there dependants who do not live with them?'});
  if(v.n===1&&v.solo==='yes') out.push({id:'solo',t:'<b>Sole caregiver</b> but a one-person household: check the household composition.'});
  if(v.lv[4]===0&&v.lv[6]===2) out.push({id:'basic',t:'Basic needs <b>met</b> but <b>high-risk</b> negative coping: check how the household covers its needs.'});
  out.forEach(x=>v.seen.add(x.id)); [...v.seen].forEach(id=>{if(!out.find(x=>x.id===id))v.resolved.add(id);});
  return out;}
function ivCase(v){const c={id:'F-NEW-'+(ADDED.length+1),month:v.month,final:-999,f:v.lv.map((i,j)=>FACT[j].lv[i]),n:v.n,spanish:v.spanish,head:v.head,solo:v.solo,
  adm:v.adm.int?'intentions incompatible with the programme':v.adm.dup?'duplicate registration':v.adm.asylum?'asylum procedure status':null,
  note:esc(v.note),guess:v.guess,reason:v.reason||'—',raise:v.raise};
  c.trueIdx=v.lv.slice();c.recIdx=v.lv.slice();c.ref=outcome(c,c.trueIdx);return c;}
function renderInterview(){
  if(!IV) IV=ivNew(true);
  const v=IV, locked=v.stage!=='form', chk=ivChecks(v);
  const seg=(name,opts,val,dis)=>`<div class="seg">${opts.map(([k,l])=>`<label><input type="radio" name="${name}" value="${k}" ${String(val)===String(k)?'checked':''} ${dis?'disabled':''}>${l}</label>`).join('')}</div>`;
  let html=`<section class="panel int"><div class="casehead"><div style="display:flex;flex-direction:column;gap:4px"><span class="kicker">Interview form · KoBo (simulated)</span><h2>New interview${v.example?' · pre-filled example':''}</h2></div>
   <div class="choices"><button class="btn sec" id="iv-blank">Blank form</button><button class="btn sec" id="iv-ex">Load example</button></div></div>
  <div class="iv-grid"><div style="display:flex;flex-direction:column;gap:14px;min-width:0">
   <div class="step"><div class="step-h"><span class="step-n">1</span><h3>Household</h3></div>
    <div class="qrow"><span>Interview month</span><select id="iv-month" ${locked?'disabled':''}>${Object.entries(MONTHS).map(([k,m])=>`<option value="${k}" ${k===v.month?'selected':''}>${m.lab}</option>`).join('')}</select></div>
    <div class="qrow"><span>Members</span><select id="iv-n" ${locked?'disabled':''}>${[1,2,3,4,5,6,7,8].map(x=>`<option ${x===v.n?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="qrow"><span>Head of household</span>${seg('iv-head',[['woman','woman'],['man','man'],['—','not applicable']],v.head,locked)}</div>
    <div class="qrow"><span>Sole caregiver</span>${seg('iv-solo',[['yes','yes'],['no','no'],['—','not applicable']],v.solo,locked)}</div>
    <div class="qrow"><span>At least one adult speaks Spanish</span>${seg('iv-sp',[['1','yes'],['0','no']],v.spanish?1:0,locked)}</div></div>
   <div class="step"><div class="step-h"><span class="step-n">2</span><h3>Scorecard questions</h3></div>
    ${FACT.map((f,j)=>`<div class="qrow"><span>${f.k}</span>${seg('iv-f'+j,f.lab.map((l,i)=>[i,l]),v.lv[j],locked)}</div>`).join('')}
    <p class="small muted">Level descriptions for intermediate levels are indicative; the numeric values are those of the Scorecard in S8.</p></div>
   <div class="step"><div class="step-h"><span class="step-n">3</span><h3>Administrative checks</h3></div>
    ${[['int','Intentions incompatible with the programme'],['dup','Duplicate registration'],['asylum','Issue with the asylum procedure']].map(([k,l])=>`<label class="small"><input type="checkbox" data-adm="${k}" ${v.adm[k]?'checked':''} ${locked?'disabled':''}> ${l}</label>`).join('')}</div>
   <div class="step"><div class="step-h"><span class="step-n">4</span><h3>Report</h3></div>
    <textarea id="iv-note" ${locked?'readonly':''} aria-label="Interviewer's report" placeholder="What you saw and heard during the interview">${esc(v.note)}</textarea></div>
   <div class="step key"><div class="step-h"><span class="step-n">5</span><h3>Your assessment, before seeing the score</h3></div>
    <p class="small muted">No calculations: based on what you saw, which vulnerability band would you put this household in?</p>
    ${seg('iv-guess',BANDS.map(b=>[b,b]),v.guess,locked)}
    <div class="qrow"><span>Main reason</span><select id="iv-reason" ${locked?'disabled':''}><option value="">—</option>${['health','housing','safety / protection','documents','language','other'].map(r=>`<option ${r===v.reason?'selected':''}>${r}</option>`).join('')}</select></div>
    <label class="small"><input type="checkbox" id="iv-raise" ${v.raise?'checked':''} ${locked?'disabled':''}> Flag "to review": the case will always go to the full track</label>
    ${locked?'':`<div><button class="btn" id="iv-close" ${v.guess&&v.note.trim().length>20?'':'disabled'}>Close the interview and calculate the score</button></div><p class="small muted" id="iv-hint">${v.guess?'':'Choose a band to close the interview.'}${v.note.trim().length>20?'':' Write the report.'}</p>`}
   </div>`;
  if(locked){
    const c=ivCase(v), sc=score(v.lv).final, tr=triggers(c);
    html+=`<div class="locked-score"><span class="kicker" style="color:var(--ok)">Interview closed · score calculated</span>
      <div class="two"><div class="box"><span class="kicker">Scorecard score</span><span class="big">${fmt(sc)}</span><span>Band ${band(sc)}</span></div>
      <div class="box"><span class="kicker">Your estimate</span><span class="big">${v.guess}</span><span class="small muted">Recorded before the score · cannot be changed</span></div></div>
      <div class="perc">${gapPill(v.guess,v.lv)}</div>
      <p>Routing: ${tr.length?'<span class="badge b-full">Full track</span>':'<span class="badge b-lite">Light track</span>'}</p>
      ${tr.length?`<div class="triggers">${tr.map(x=>`<span class="chip ${x.w?'w':''}">${x.t}</span>`).join('')}</div>`:''}
      <p class="small muted">Only the caseworker sees the outcome (inclusion, waiting list, exclusion). The interviewer sees the score, not the decision.</p>
      <div class="choices">${v.sent?'<span class="toast">Sent to the caseworker\'s queue.</span><button class="btn" id="iv-go">Open the review</button>':'<button class="btn" id="iv-send">Send to the caseworker</button>'}<button class="btn sec" id="iv-new">New interview</button></div></div>`;
  }
  html+=`</div><aside class="live"><div class="panel"><h3>Live checks</h3><p class="small muted">While the household is still present: the only moment when a wrong data point can be fixed at the source.</p>
    ${chk.length?chk.map(x=>`<div class="chk">${x.t}</div>`).join(''):'<div class="chk ok">No inconsistencies in the data entered.</div>'}
    ${v.resolved.size?`<p class="small" style="color:var(--ok)">Inconsistencies resolved during the interview: ${v.resolved.size}</p>`:''}</div>
    <div class="panel"><h3>What you don't see here</h3><p class="small muted">The score only appears after your assessment, so it cannot influence it. You see neither the budget nor the outcome: those belong to the system and the caseworker.</p></div></aside></div></section>`;
  app.innerHTML=html; bindInterview();
}
function bindInterview(){
  const v=IV, g=id=>document.getElementById(id), rr=()=>renderInterview();
  g('iv-ex').onclick=()=>{IV=ivNew(true);rr();}; g('iv-blank').onclick=()=>{IV=ivNew(false);rr();};
  if(v.stage==='form'){
    g('iv-month').onchange=e=>{v.month=e.target.value;rr();};
    g('iv-n').onchange=e=>{v.n=+e.target.value;rr();};
    app.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{const n=el.name,val=el.value;
      if(n==='iv-head')v.head=val; else if(n==='iv-solo')v.solo=val; else if(n==='iv-sp')v.spanish=val==='1'; else if(n==='iv-guess')v.guess=val; else if(n.startsWith('iv-f'))v.lv[+n.slice(4)]=+val; v.example=false; rr();});
    app.querySelectorAll('[data-adm]').forEach(el=>el.onchange=()=>{v.adm[el.dataset.adm]=el.checked;rr();});
    g('iv-note').oninput=e=>{v.note=e.target.value;const b=g('iv-close');if(b)b.disabled=!(v.guess&&v.note.trim().length>20);};
    g('iv-reason').onchange=e=>{v.reason=e.target.value;};
    g('iv-raise').onchange=e=>{v.raise=e.target.checked;};
    if(g('iv-close')) g('iv-close').onclick=()=>{v.stage='scored';v.closedAt=performance.now();rr();};
  } else {
    if(g('iv-send')) g('iv-send').onclick=()=>{const c=ivCase(v);ADDED.push(c);v.sent=true;v.sentIdx=CASES.length+ADDED.length-1;
      LOG.I.push({id:c.id,month:v.month,guess:v.guess,band_scorecard:band(score(v.lv).final),gap:gapOf(v.guess,v.lv),reason:v.reason,raise:v.raise,score:+score(v.lv).final.toFixed(2),checks_shown:[...v.seen],checks_resolved:[...v.resolved],secs:Math.round((v.closedAt-v.t0)/1000)});rr();};
    // open the review directly on the case just sent
    if(g('iv-go')) g('iv-go').onclick=()=>{cur.B=v.sentIdx;setMode('B');};
    g('iv-new').onclick=()=>{IV=ivNew(false);rr();};
  }
}

render();
})();
</script>

</body></html>
