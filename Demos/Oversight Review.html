/* Visual layer: humanitarian case-management look. UNHCR-inspired blues, warm orange for the cost of error,
   soft rounded surfaces. Content and logic are unchanged. */
:root{
  --paper:#e3eaf3;--sheet:#ffffff;--ink:#0f2742;--ink-2:#45586f;--rule:#c9d5e3;--rule-2:#dfe6ef;--hdr:#f1f5fa;--strong:#18375f;
  --accent:#0072bc;--accent-strong:#005b97;--accent-soft:#e2eefa;--on-accent:#ffffff;
  --warn:#c9461a;--warn-soft:#fdeee6;--ok:#00806a;--ok-soft:#ddf3ee;
  --lite:#7a8ba1;--lite-soft:#eef2f7;--old:#6c4f9a;--old-soft:#f1ecf8;--sun:#ffc740;
  --navy:#18375f;--navy-2:#0f2a4b;
  --shadow:0 1px 2px rgba(22,48,79,.05),0 6px 20px rgba(22,48,79,.07);
  --shadow-sm:0 1px 2px rgba(22,48,79,.06);
  --f-display:"Lato","Helvetica Neue",Arial,sans-serif;--f-body:"Lato","Helvetica Neue",Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0a1320;--sheet:#132234;--ink:#f0f5fb;--ink-2:#aebfd2;--rule:#2d4560;--rule-2:#203449;--hdr:#1a2d44;--strong:#2b4c78;
  --accent:#4ea8ec;--accent-strong:#7cc0f2;--accent-soft:#12304d;--on-accent:#06192b;
  --warn:#f08a5d;--warn-soft:#3b2318;--ok:#3ec6a6;--ok-soft:#0f342d;--lite:#9cb0c7;--lite-soft:#1a2b40;--old:#b79be3;--old-soft:#271f3d;
  --navy:#0a1626;--navy-2:#07111e;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--shadow-sm:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1320;--sheet:#132234;--ink:#f0f5fb;--ink-2:#aebfd2;--rule:#2d4560;--rule-2:#203449;--hdr:#1a2d44;--strong:#2b4c78;
  --accent:#4ea8ec;--accent-strong:#7cc0f2;--accent-soft:#12304d;--on-accent:#06192b;
  --warn:#f08a5d;--warn-soft:#3b2318;--ok:#3ec6a6;--ok-soft:#0f342d;--lite:#9cb0c7;--lite-soft:#1a2b40;--old:#b79be3;--old-soft:#271f3d;
  --navy:#0a1626;--navy-2:#07111e;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--shadow-sm:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:clamp(12px,2.5vw,32px);padding-block:16px 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.005em;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(26px,3.2vw,34px);font-weight:900;line-height:1.15}
h2{font-size:22px;font-weight:900}
h3{font-size:16.5px;font-weight:700}
p{margin:0}
b{font-weight:700}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.kicker{font-family:var(--f-body);font-weight:700;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.banner{font-size:13px;color:var(--ink-2);border:1px dashed var(--rule);border-radius:12px;padding:8px 12px;background:var(--sheet)}

/* app bar */
.appbar{display:flex;justify-content:space-between;align-items:center;gap:14px 20px;flex-wrap:wrap;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);border-radius:20px;padding:12px 14px 12px 18px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand svg,.brand .logo{width:38px;height:38px;flex:none;display:block;border-radius:10px}
.wordmark{font:900 21px/1 var(--f-display);letter-spacing:-.01em;color:#fff}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:6px 4px 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:rgba(255,255,255,.08);padding:4px;border-radius:14px}
.tab{appearance:none;border:none;background:transparent;color:#d4e2f2;padding:9px 15px;border-radius:11px;font:700 14px var(--f-body);cursor:pointer;transition:background .15s,color .15s}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab[aria-selected="true"]{box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tab[aria-selected="true"].old{background:#8b6cc0;color:#fff}
.tab[aria-selected="true"].new{background:#0072bc;color:#fff}
.tab[aria-selected="true"].int{background:#00866f;color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tab:focus-visible{outline-color:var(--sun)}

/* queue */
.queue{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-inline:4px}
.queue:empty{display:none}
.queue .kicker{margin-right:4px}
.qi{appearance:none;cursor:pointer;font:500 12.5px var(--f-mono);border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 12px;color:var(--ink-2);transition:border-color .15s,background .15s;box-shadow:var(--shadow-sm)}
.qi:hover{border-color:var(--accent)}
.qi.cur{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.qi.done{background:var(--ok-soft);color:var(--ok);border-color:transparent;box-shadow:none}
.qi.done::before{content:"✓ ";font-weight:700}
.qi.done.cur{background:var(--ok);color:var(--on-accent)}

/* surfaces */
.panel{background:var(--sheet);border:1px solid var(--rule-2);border-radius:20px;padding:22px clamp(16px,2.4vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.casehead{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:7px;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.b-full{background:var(--accent);color:var(--on-accent)}
.b-lite{background:var(--lite-soft);color:var(--ink);border:1px solid var(--rule)}
.b-lite::before{background:var(--lite)}
.b-old{background:var(--old-soft);color:var(--old)}
.triggers{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid #f3d8a0;background:#fff6df;color:#7a5200}
.chip::before{content:"!";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#e8a400;color:#fff;font-size:10.5px;font-weight:900}
.chip.w{border-color:transparent;color:var(--warn);background:var(--warn-soft)}
.chip.w::before{background:var(--warn)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip:not(.w){background:#33290f;border-color:#5a4718;color:#f4cf73}}
:root[data-theme="dark"] .chip:not(.w){background:#33290f;border-color:#5a4718;color:#f4cf73}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.fact{background:var(--paper);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:700}
.fact b{display:block;font-size:11px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.step{border:1px solid var(--rule);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:var(--sheet)}
.step.locked{opacity:.45;pointer-events:none}
.step.key{border:1.5px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:linear-gradient(180deg,var(--accent-soft) 0,var(--sheet) 64px)}
.step-h{display:flex;gap:11px;align-items:center}
.step-n{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);font:900 14.5px/1 var(--f-display)}
.lite .step-n{background:var(--lite);color:#fff}
.old .step-n{background:var(--old);color:#fff}
.int .step-n{background:var(--ok);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lite .step-n,:root:not([data-theme="light"]) .old .step-n,:root:not([data-theme="light"]) .int .step-n{color:var(--on-accent)}}
:root[data-theme="dark"] .lite .step-n,:root[data-theme="dark"] .old .step-n,:root[data-theme="dark"] .int .step-n{color:var(--on-accent)}

/* table */
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:9px 14px;border-top:1px solid var(--rule-2);vertical-align:middle}
th{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);border-top:none;background:var(--paper)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td:first-child{font-weight:700}
td.mono{white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.flag td,tr.flag:hover td{background:var(--warn-soft)}
tr.flag td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
.pts{display:inline-block;height:8px;background:var(--accent);border-radius:999px;vertical-align:middle;margin-right:8px;opacity:.85}
td label.small{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink-2)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0}

.note{background:var(--paper);border-left:4px solid var(--accent);padding:12px 16px;border-radius:4px 14px 14px 4px;font-size:15.5px;line-height:1.6}
.old .note{border-left-color:var(--old)}
.perc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14.5px}
.pill{font:700 12.5px var(--f-body);padding:5px 12px;border-radius:999px}
.p-under{background:var(--warn-soft);color:var(--warn)}.p-ok{background:var(--ok-soft);color:var(--ok)}.p-over{background:var(--accent-soft);color:var(--accent-strong)}
details summary{cursor:pointer;color:var(--accent-strong);font-weight:700;width:max-content;max-width:100%}

/* controls */
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{appearance:none;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);padding:10px 18px;border-radius:12px;font:700 15px var(--f-body);cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.old .choice:hover{border-color:var(--old)}
.old .choice[aria-pressed="true"]{background:var(--old);border-color:var(--old);color:#fff;box-shadow:none}
.btn{appearance:none;border:none;background:var(--accent);color:var(--on-accent);padding:11px 20px;border-radius:12px;font:700 15px var(--f-body);cursor:pointer;transition:background .15s,transform .05s;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn:hover:not(:disabled){background:var(--accent-strong)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.sec{background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule);box-shadow:none}
.btn.sec:hover:not(:disabled){background:var(--paper);border-color:var(--accent)}
.btn.old{background:var(--old);color:#fff}
.btn.old:hover:not(:disabled){background:var(--old);filter:brightness(.92)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.anchors{display:flex;flex-wrap:wrap;gap:6px}
.anchor{display:flex;gap:7px;align-items:center;font-size:13.5px;background:var(--sheet);border:1.5px solid var(--rule);border-radius:999px;padding:5px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.anchor:hover{border-color:var(--accent)}
.anchor:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.two>*{min-width:0}
.box{background:var(--paper);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.box .big{font:900 28px/1.15 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.outcome{font:900 21px var(--f-display);padding:2px 12px;border-radius:999px;display:inline-block}
.o-in{color:var(--ok);background:var(--ok-soft)}.o-wl{color:var(--warn);background:var(--warn-soft)}.o-ex{color:var(--ink-2);background:var(--lite-soft)}
.warnbox{background:var(--warn-soft);border-left:4px solid var(--warn);padding:12px 16px;border-radius:4px 14px 14px 4px;font-size:14.5px}
.warnbox b{color:var(--warn)}
.oldreason{font-size:14.5px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.oldreason>div{background:var(--old-soft);border-radius:12px;padding:10px 14px}
.oldreason>div:last-child{grid-column:1/-1;background:var(--sheet);border:1.5px solid var(--old)}
.oldreason b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--old);margin-bottom:2px}
.stmt{background:var(--old-soft);border-radius:16px;padding:14px 18px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.answer{border:2px solid var(--old);background:linear-gradient(135deg,var(--old-soft),var(--sheet));border-radius:18px;padding:16px 20px;display:flex;gap:32px;flex-wrap:wrap;align-items:baseline}
.answer .big{font:900 30px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate button{width:48px;height:44px;padding:0;border-radius:50%}
textarea{width:100%;min-height:130px;font:15px/1.55 var(--f-body);background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule);border-radius:14px;padding:12px 14px;resize:vertical}
textarea:focus{border-color:var(--accent)}
select{font:15px var(--f-body);background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule);border-radius:10px;padding:7px 10px;max-width:100%}
.toast{font-size:14px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:9px 14px;border-radius:12px;align-self:center}
.toast::before{content:"✓ "}

/* interviewer */
.iv-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.iv-grid{grid-template-columns:1fr}}
.qrow{display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule-2)}
.qrow>span:first-child{font-weight:700;font-size:14.5px}
.step-h+.qrow{border-top:none}
@media (max-width:560px){.qrow{grid-template-columns:1fr;gap:6px}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{font-size:13.5px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;transition:border-color .15s,background .15s}
.seg label:hover{border-color:var(--ok)}
.seg label:has(input:checked){background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.seg label:has(input:disabled){cursor:default}
.seg input{accent-color:var(--ok)}
.int input[type=checkbox]{accent-color:var(--ok)}
.int .step>label.small{display:flex;gap:8px;align-items:center;cursor:pointer;padding:3px 0}
.int .step.key{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok-soft);background:linear-gradient(180deg,var(--ok-soft) 0,var(--sheet) 64px)}
.int .btn:not(.sec){background:var(--ok)}
.int .btn:not(.sec):hover:not(:disabled){background:var(--ok);filter:brightness(.92)}
.live{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.live .panel{padding:18px 18px;gap:10px;border-radius:18px}
.chk{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:4px 12px 12px 4px;padding:10px 14px;font-size:14px}
.chk.ok{border-color:var(--ok);background:var(--ok-soft)}
.locked-score{border:2px solid var(--ok);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,var(--ok-soft) 0,var(--sheet) 80px)}

/* ---- contrast & hierarchy pass ---- */
.panel{border:1px solid var(--rule)}
section.panel:not(.lite):not(.old):not(.int){border-top:5px solid var(--accent)}
section.panel.lite{border-top:5px solid var(--lite)}
section.panel.old{border-top:5px solid var(--old)}
section.panel.int{border-top:5px solid var(--ok)}
.live .panel{border-top:1px solid var(--rule)}
.fact{border:1px solid var(--rule-2)}
.panel>.step+.step,.panel>.step+.stmt,.panel>.stmt+.answer,.panel>.answer+.step{margin-top:6px}
/* every step gets a header strip: input steps neutral */
.step{border:1px solid var(--rule);padding:16px 20px 18px;gap:14px;box-shadow:var(--shadow-sm)}
.step>.step-h:first-child{margin:-16px -20px 2px;padding:12px 20px;background:var(--hdr);border-bottom:1px solid var(--rule);border-radius:15px 15px 0 0}
.step h3{font-size:17px;font-weight:900}
/* decision steps: solid coloured header */
.step.key{border:2px solid var(--accent);box-shadow:0 0 0 5px var(--accent-soft),var(--shadow);background:var(--sheet)}
.step.key>.step-h:first-child{background:var(--accent);border-bottom:none;margin:-16px -20px 4px;border-radius:13px 13px 0 0}
.step.key>.step-h h3{color:var(--on-accent)}
.step.key>.step-h .step-n{background:var(--on-accent);color:var(--accent)}
.int .step.key{border-color:var(--ok);box-shadow:0 0 0 5px var(--ok-soft),var(--shadow);background:var(--sheet)}
.int .step.key>.step-h:first-child{background:var(--ok)}
.int .step.key>.step-h .step-n{color:var(--ok)}
/* result step (calculated outcome): dark header */
.step:has(.outcome){border:2px solid var(--strong)}
.step:has(.outcome)>.step-h:first-child{background:var(--strong);border-bottom:none;border-radius:13px 13px 0 0}
.step:has(.outcome)>.step-h h3{color:#fff}
.step:has(.outcome)>.step-h .step-n{background:#fff;color:var(--strong)}
.step:has(.outcome)>p{font-size:16px;padding:10px 14px;background:var(--hdr);border-radius:12px}
/* confirm step: green */
.step:has(#confirm-agree){border:2px solid var(--ok)}
.step:has(#confirm-agree)>.step-h:first-child{background:var(--ok);border-bottom:none;border-radius:13px 13px 0 0}
.step:has(#confirm-agree)>.step-h h3{color:var(--on-accent)}
.step:has(#confirm-agree)>.step-h .step-n{background:var(--on-accent);color:var(--ok)}
.step:has(#confirm-agree) .btn{background:var(--ok)}
/* escalate notice (light track mismatch) */
.step:has(#escalate){border:2px solid var(--warn);background:var(--warn-soft)}
/* old mode: the human-judgement steps */
.old .step:has([data-rate]),.old .step:has(#acc){border:2px solid var(--old)}
.old .step:has([data-rate])>.step-h:first-child,.old .step:has(#acc)>.step-h:first-child{background:var(--old);border-bottom:none;border-radius:13px 13px 0 0}
.old .step:has([data-rate])>.step-h h3,.old .step:has(#acc)>.step-h h3{color:#fff}
.old .step:has([data-rate])>.step-h .step-n,.old .step:has(#acc)>.step-h .step-n{background:#fff;color:var(--old)}
.answer{box-shadow:var(--shadow)}
/* interviewer result */
.locked-score{border-width:2px;box-shadow:0 0 0 5px var(--ok-soft),var(--shadow);background:var(--sheet)}
.locked-score>.kicker:first-child{margin:-16px -18px 4px;padding:12px 18px;background:var(--ok);color:var(--on-accent)!important;border-radius:15px 15px 0 0;font-size:12.5px}
/* boxes and choices */
.box{border:1px solid var(--rule-2)}
.choice{border-color:var(--rule);border-width:2px}
.chip:not(.w){border-width:1.5px}
th{background:var(--hdr);color:var(--ink-2)}
.muted,.small.muted{color:var(--ink-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step:has(.outcome)>.step-h h3,:root:not([data-theme="light"]) .old .step:has([data-rate])>.step-h h3,:root:not([data-theme="light"]) .old .step:has(#acc)>.step-h h3{color:#fff}
 :root:not([data-theme="light"]) .old .step:has([data-rate])>.step-h:first-child,:root:not([data-theme="light"]) .old .step:has(#acc)>.step-h:first-child{background:#5d4690}}
:root[data-theme="dark"] .old .step:has([data-rate])>.step-h:first-child,:root[data-theme="dark"] .old .step:has(#acc)>.step-h:first-child{background:#5d4690}

/* ---- monochrome page background ---- */
:root{--page:#0072bc;--page-ink:#ffffff;--page-ink-2:#d5e8f7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#050c16;--page-ink:#f0f5fb;--page-ink-2:#9fb3c8}}
:root[data-theme="dark"]{--page:#050c16;--page-ink:#f0f5fb;--page-ink-2:#9fb3c8}
body{background:var(--page)}
.appbar{background:var(--strong);box-shadow:0 8px 24px rgba(0,20,50,.25)}
header.top h1{color:var(--page-ink)}
header.top .kicker,.queue .kicker{color:var(--page-ink-2)}
.qi{border-color:transparent;box-shadow:0 1px 3px rgba(0,20,50,.2)}
.qi.cur{background:var(--strong);color:#fff;border-color:#fff;box-shadow:0 0 0 2px var(--page),0 0 0 4px #fff}
.qi.done{background:var(--ok-soft);color:var(--ok)}
.qi.done.cur{background:var(--ok);color:#fff}
main>.panel{box-shadow:0 12px 36px rgba(0,20,50,.3);border-color:transparent}
.live .panel{box-shadow:0 8px 24px rgba(0,20,50,.25);border-color:transparent}

/* ---- button roles ---- */
/* 1. primary action: solid, larger, arrow */
.btn:not(.sec){padding:13px 24px;font-size:15.5px;font-weight:900;border-radius:12px;box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 35%,transparent);letter-spacing:.01em}
.btn:not(.sec)::after{content:"→";margin-left:10px;display:inline-block;transition:transform .15s}
.btn:not(.sec):hover:not(:disabled)::after{transform:translateX(3px)}
.btn:not(.sec):disabled{box-shadow:none}
.btn:not(.sec):disabled::after{content:none}
/* 2. secondary action: ghost, no fill */
.btn.sec{background:transparent;border:1.5px solid var(--rule);color:var(--ink-2);font-weight:700;padding:9px 16px;border-radius:999px;font-size:14px}
.btn.sec:hover:not(:disabled){background:var(--hdr);color:var(--ink);border-color:var(--ink-2)}
/* 3. escalation: "To review → full track" */
#raise{border:1.5px dashed var(--warn);color:var(--warn);background:var(--warn-soft)}
#raise:hover{background:var(--warn-soft);color:var(--warn);border-style:solid}
/* 4. options to choose from: radio cards, never solid */
.choices:has(.choice){gap:10px}
.choice{display:inline-flex;align-items:center;gap:10px;min-width:150px;padding:13px 18px 13px 14px;border-radius:12px;border:2px solid var(--rule);background:var(--sheet);font-size:15.5px;box-shadow:none}
.choice::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--rule);background:var(--sheet);transition:border-color .15s,box-shadow .15s}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent);box-shadow:none}
.choice[aria-pressed="true"]::before{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--sheet);background:var(--accent)}
.old .choice[aria-pressed="true"]{background:var(--old-soft);color:var(--old);border-color:var(--old)}
.old .choice[aria-pressed="true"]::before{border-color:var(--old);background:var(--old)}
/* rating scale: numbered circles */
.rate .choice{min-width:0;width:46px;height:46px;padding:0;justify-content:center;border-radius:50%}
.rate .choice::before{content:none}
.old .rate .choice[aria-pressed="true"]{background:var(--old);color:#fff;border-color:var(--old)}

/* ======== Oversight review: same system, supervisor identity (navy ground) ======== */
:root{--oA:#1baf7a;--oB:#2a78d6;--oC:#eda100;--page:#18375f;--page-ink-2:#b9cce2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--oA:#199e70;--oB:#3987e5;--oC:#c98500;--page:#040a12;--page-ink-2:#9fb3c8}}
:root[data-theme="dark"]{--oA:#199e70;--oB:#3987e5;--oC:#c98500;--page:#040a12;--page-ink-2:#9fb3c8}
.appbar{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);box-shadow:none}
.appbar .view{align-self:center;font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#18375f;background:#ffc740;padding:7px 14px;border-radius:999px}
#app{display:flex;flex-direction:column;gap:20px}
main>.panel{border-top:5px solid #ffc740!important}
/* filters: navy selected state instead of green */
.ov-filters{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center;padding:12px 16px;background:var(--hdr);border-radius:14px}
.ov-filters>div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ov-filters .seg label:hover{border-color:var(--strong)}
.ov-filters .seg label:has(input:checked){background:var(--strong);border-color:var(--strong);color:#fff}
.ov-filters .seg input{accent-color:#ffc740}
/* office tiles: big selectable cards */
.ov-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.ov-tile{background:var(--sheet);border:1.5px solid var(--rule);border-top:7px solid var(--rule);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s}
.ov-pick{appearance:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.ov-pick:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ov-pick[aria-pressed="true"]{border-color:var(--strong);box-shadow:0 0 0 3px var(--strong),var(--shadow);background:var(--sheet)}
.ov-tile .kicker{font-size:12px}
.ov-tile .st{font:800 13px var(--f-body);letter-spacing:.04em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center;align-self:flex-start;padding:4px 10px;border-radius:999px}
.ov-tile .st.ok{color:var(--ok);background:var(--ok-soft)}.ov-tile .st.bad{color:var(--warn);background:var(--warn-soft)}
.ov-tile .num{font:900 30px var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.ov-mini{display:flex;gap:8px;font-size:13px;color:var(--ink-2);flex-wrap:wrap;margin-top:4px}
.ov-mini>span{background:var(--hdr);border-radius:8px;padding:4px 9px}
.ov-mini b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
/* chart */
.ov-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.ov-chart{background:var(--hdr);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ov-chart svg{width:100%;max-width:820px;height:auto;display:block;overflow:visible}
.ov-chart svg:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;color:var(--ink-2);align-items:center}
.legend>span{display:inline-flex;align-items:center}
.legend .k{display:inline-block;width:20px;height:0;border-top:3px solid;border-radius:2px;margin-right:7px}
.legend .ring{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--warn);margin-right:7px}
.legend .dash{display:inline-block;width:20px;border-top:1.5px dashed var(--ink-2);margin-right:7px}
#tip{position:fixed;pointer-events:none;z-index:10;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 10px 28px rgba(0,20,50,.22);display:none;min-width:170px}
#tip .tr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:3px}
#tip .tr b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
#tip .tk{display:inline-block;width:12px;border-top:3px solid;border-radius:2px;margin-right:6px;vertical-align:middle}
/* caseworker table */
.ci{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.alarm-tag{display:inline-block;font:800 12px var(--f-body);color:var(--warn);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:999px;padding:3px 10px;white-space:nowrap;margin:2px 0}
.rev-tag{font:800 12px var(--f-body);color:var(--accent-strong);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.closed-tag{font:800 12px var(--f-body);color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
td.flagc{color:var(--warn);font-weight:800}
tr.cwr{cursor:pointer}
tr.cwr td:first-child{font-family:var(--f-mono);font-weight:500}
tr.cwr.flagged td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
tr.cwr:hover td{background:var(--accent-soft)}
tr.cwr:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
tr.cwd td,tr.cwd:hover td{background:var(--hdr)}
.cwd-in{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;padding:6px 2px}
@media (max-width:640px){.cwd-in{grid-template-columns:1fr}}
.sortb{appearance:none;background:none;border:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.sortb:hover{color:var(--ink)}
th.n .sortb{text-align:right}
.never{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.never div{background:var(--hdr);border-radius:12px;padding:10px 12px;font-size:14px}
/* alert workflow buttons: compact versions of the roles */
.btn.sm:not(.sec){padding:7px 14px;font-size:13px;border-radius:10px;box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 30%,transparent)}
.btn.sm::after{margin-left:6px}
.btn.sec.sm{padding:5px 12px;font-size:12.5px}
.linkb{appearance:none;background:none;border:none;color:var(--accent-strong);font:700 13px var(--f-body);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.al-form{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:260px}
.al-form input{font:13.5px var(--f-body);background:var(--sheet);color:var(--ink);border:1.5px solid var(--rule);border-radius:10px;padding:6px 10px;min-width:0;flex:1 1 120px}
.al-form select{font-size:13.5px}
details ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
</style>

const OFF=['A','B','C'], OCOL={A:'var(--oA)',B:'var(--oB)',C:'var(--oC)'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const RULES=[

const pct=x=>Math.round(100*x)+'%', dec=x=>x.toFixed(2), fv=(m,x)=>x==null||isNaN(x)?'—':MET[m].fmt==='pct'?pct(x):dec(x);
const ids=u=>Object.keys(CW).filter(k=>k.startsWith('CW-'+u));
function agg(list,a,b){const s=[0,0,0,0,0,0];list.forEach(id=>CW[id].slice(a,b).forEach(r=>r.forEach((v,j)=>s[j]+=v)));return s;}
function val(s,m){return m==='sw'?(s[1]?s[0]/s[1]:null):m==='woa'?(s[1]?s[2]/s[1]:null):(s[5]?s[4]/s[5]:null);}
function nOf(s,m){return m==='co'?s[5]:s[1];}
// office control chart, monthly
function officeSeries(u,m){const L=ids(u), base=agg(L,0,6), p0=val(base,m);
  let sd; if(m==='woa'){const n=base[1];sd=Math.sqrt(Math.max(1e-6,base[3]/n-p0*p0));}
  return MON.map((_,i)=>{const s=agg(L,i,i+1),p=val(s,m),n=nOf(s,m),se=m==='woa'?sd/Math.sqrt(n):Math.sqrt(p0*(1-p0)/n);
    const bad=m==='co'?-1:1, lim=p0+bad*3*se; return {i,p,n,p0,lim,alarm:i>=6&&bad*(p-lim)>0};});}
function officeTrendAlerts(u){const out=[];['sw','woa','co'].forEach(m=>{const S=officeSeries(u,m),h=S.filter(x=>x.alarm);if(h.length)out.push({m,first:h[0],count:h.length});});return out;}
function cwRow(id){const [a,b]=PER[OVS.per],s=agg([id],a,b),h1=agg([id],0,6),h2=agg([id],6,12);
  const r={id,cases:(b-a)*40,sw:val(s,'sw'),swn:s[1],swk:s[0],woa:val(s,'woa'),co:val(s,'co'),cok:s[4],con:s[5],
    dwoa:(OVS.per!=='h1'&&h1[1]>=10&&h2[1]>=10)?val(h2,'woa')-val(h1,'woa'):null,flags:[]};
  if(r.swn>=20&&r.sw>=.75) r.flags.push({rule:'swhi',m:'sw',txt:`Switch fraction ${pct(r.sw)} (${r.swk}/${r.swn})`});
  if(r.swn>=20&&r.sw<=.15) r.flags.push({rule:'swlo',m:'sw',txt:`Switch fraction ${pct(r.sw)} (${r.swk}/${r.swn})`});
  if(r.dwoa!=null&&r.dwoa>=.2) r.flags.push({rule:'woaup',m:'woa',txt:`WOA ${dec(val(h1,'woa'))} → ${dec(val(h2,'woa'))}`});
  if(r.con>=6&&r.co<=.5) r.flags.push({rule:'colo',m:'co',txt:`Correct override ${pct(r.co)} (${r.cok}/${r.con})`});
  return r;}
const ruleT=id=>RULES.find(r=>r.id===id).t;
const tip=()=>document.getElementById('tip')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'tip',role:'status'}));
function showTip(x,y,title,rows){const t=tip();t.replaceChildren();const h=document.createElement('div');h.className='small muted';h.textContent=title;t.appendChild(h);
  rows.forEach(r=>{const d=document.createElement('div');d.className='tr';const l=document.createElement('span');l.className='small';
    if(r.col){const k=document.createElement('span');k.className='tk';k.style.borderColor=r.col;l.appendChild(k);}
    l.appendChild(document.createTextNode(r.label));const v=document.createElement('b');v.textContent=r.value;d.append(l,v);t.appendChild(d);});
  t.style.display='block';const w=t.offsetWidth,hh=t.offsetHeight;t.style.left=Math.min(window.innerWidth-w-8,x+14)+'px';t.style.top=Math.max(8,y-hh-10)+'px';}
const hideTip=()=>{const t=document.getElementById('tip');if(t)t.style.display='none';};

function trendChart(){
  const m=OVS.met, W=620,H=230,L=40,R=34,T=12,B=28,iw=W-L-R,ih=H-T-B;
  const S={};OFF.forEach(u=>S[u]=officeSeries(u,m));
  const X=i=>L+iw*i/11, Y=p=>T+ih*(1-p);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" tabindex="0" id="trend" aria-label="${MET[m].t} by month, offices A, B, C; office ${OVS.off} highlighted">`;
  [0,.25,.5,.75,1].forEach(g=>s+=`<line x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--rule)" stroke-width="${g?0.6:1}"/><text x="${L-6}" y="${Y(g)+4}" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="var(--f-mono)">${MET[m].fmt==='pct'?g*100+'%':g.toFixed(2)}</text>`);
  MON.forEach((mm,i)=>s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-2)">${mm}</text>`);
  s+=`<rect x="${L}" y="${T}" width="${X(5.5)-L}" height="${ih}" fill="var(--ink)" opacity=".04"/><text x="${L+4}" y="${T+12}" font-size="10.5" fill="var(--ink-2)">baseline</text>`;
  const sel=S[OVS.off];
  s+=`<polyline points="${sel.map(d=>`${X(d.i)},${Y(Math.max(0,Math.min(1,d.lim)))}`).join(' ')}" fill="none" stroke="var(--ink-2)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  [...OFF.filter(u=>u!==OVS.off),OVS.off].forEach(u=>{const on=u===OVS.off,op=on?1:.35;
    s+=`<polyline points="${S[u].map(d=>`${X(d.i)},${Y(d.p)}`).join(' ')}" fill="none" stroke="${OCOL[u]}" stroke-width="${on?2.5:1.5}" opacity="${op}" stroke-linejoin="round"/>`;
    S[u].forEach(d=>{s+=`<circle cx="${X(d.i)}" cy="${Y(d.p)}" r="${on?3.5:2.5}" fill="${OCOL[u]}" opacity="${op}" stroke="var(--paper)" stroke-width="1.5"/>`;
      if(on&&d.alarm) s+=`<circle cx="${X(d.i)}" cy="${Y(d.p)}" r="7.5" fill="none" stroke="var(--warn)" stroke-width="2"/>`;});});
  const ends=OFF.map(u=>({u,y:Y(S[u][11].p)+4})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<13) ends[i].y=ends[i-1].y+13;
  ends.forEach(e=>s+=`<text x="${W-R+6}" y="${e.y}" font-size="12" font-weight="${e.u===OVS.off?700:500}" fill="var(--ink)" opacity="${e.u===OVS.off?1:.6}">${e.u}</text>`);
  s+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="var(--ink)" stroke-width="1" opacity="0"/>`;
  for(let i=0;i<12;i++) s+=`<rect class="hit" data-i="${i}" x="${X(i)-iw/22}" y="${T}" width="${iw/11}" height="${ih}" fill="transparent"/>`;
  return s+'</svg>';
}
function bindTrend(){const svg=document.getElementById('trend'),xh=svg.querySelector('.xh'),m=OVS.met;let cur=-1;
  const show=(i,cx,cy)=>{cur=i;const r=svg.querySelector(`.hit[data-i="${i}"]`),x=+r.getAttribute('x')+ +r.getAttribute('width')/2;
    xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('opacity',.35);
    if(cx==null){const b=svg.getBoundingClientRect();cx=b.left+b.width*x/620;cy=b.top+20;}
    showTip(cx,cy,MET[m].t+' · '+MON[i]+' 2024',OFF.map(u=>{const d=officeSeries(u,m)[i];return {col:OCOL[u],label:'Office '+u+(d.alarm&&u===OVS.off?' · alert':''),value:fv(m,d.p)+' (n='+d.n+')'};}));};
  svg.querySelectorAll('.hit').forEach(r=>r.addEventListener('pointermove',e=>show(+r.dataset.i,e.clientX,e.clientY)));
  svg.addEventListener('pointerleave',()=>{xh.setAttribute('opacity',0);hideTip();});
  svg.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show(Math.max(0,Math.min(11,(cur<0?0:cur)+(e.key==='ArrowRight'?1:-1))));}});
  svg.addEventListener('focus',()=>show(cur<0?6:cur));svg.addEventListener('blur',()=>{xh.setAttribute('opacity',0);hideTip();});}
function spark(id,m){const W=260,H=54,L=4,R=4,T=6,B=14,iw=W-L-R,ih=H-T-B,X=i=>L+iw*i/11,Y=p=>T+ih*(1-p);
  const pts=MON.map((_,i)=>{const s=agg([id],i,i+1);return [i,val(s,m)];}).filter(x=>x[1]!=null);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:260px;max-width:100%;height:auto" role="img" aria-label="${MET[m].t} by month for ${id}">
   <line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--rule)"/><line x1="${X(5.5)}" x2="${X(5.5)}" y1="${T}" y2="${Y(0)}" stroke="var(--rule)" stroke-dasharray="2 2"/>
   <polyline points="${pts.map(([i,p])=>`${X(i)},${Y(p)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>
   ${pts.map(([i,p])=>`<circle cx="${X(i)}" cy="${Y(p)}" r="2.5" fill="var(--accent)"/>`).join('')}
   <text x="${L}" y="${H-2}" font-size="10" fill="var(--ink-2)">Jan</text><text x="${W-R}" y="${H-2}" font-size="10" fill="var(--ink-2)" text-anchor="end">Dec</text></svg>`;}

function renderOversight(){
  const [a,b,plab]=PER[OVS.per], endLab=OVS.per==='h1'?'30 Jun 2024':'31 Dec 2024';
  const rowsOf=u=>ids(u).map(cwRow);
  const trendOf=u=>OVS.per==='h1'?[]:officeTrendAlerts(u);
  const seg=(name,opts,cur)=>`<div class="seg" role="radiogroup" aria-label="${name}">${opts.map(([k,l])=>`<label><input type="radio" name="ov-${name}" value="${k}" ${k===cur?'checked':''}>${l}</label>`).join('')}</div>`;
  const tile=u=>{const s=agg(ids(u),a,b),R=rowsOf(u),nf=R.filter(r=>r.flags.length).length,tr=trendOf(u);
    return `<button class="ov-tile ov-pick" data-off="${u}" aria-pressed="${u===OVS.off}" style="border-top-color:${OCOL[u]}">
      <span class="kicker">Office ${u} · ${ids(u).length} caseworkers</span>
      <span class="st ${tr.length?'bad':'ok'}">${tr.length?'⚠ Trend alert from '+MON[Math.min(...tr.map(x=>x.first.i))]:'✓ No trend alert'}</span>
      <span class="small">${nf?`<b style="color:var(--warn)">${nf} caseworker${nf>1?'s':''} flagged</b>`:'No caseworkers flagged'}</span>
      <span class="ov-mini"><span>SF <b>${pct(val(s,'sw'))}</b></span><span>WOA <b>${dec(val(s,'woa'))}</b></span><span>CO <b>${pct(val(s,'co'))}</b></span></span></button>`;};
  // office detail
  const u=OVS.off, R=rowsOf(u), cols=[['id','Caseworker'],['cases','Cases','n'],['sw','Switch fraction','n'],['woa','WOA','n'],['dwoa','Δ WOA vs Jan–Jun','n'],['co','Correct override (sentinels)','n'],['flags','Flags']];
  const key=OVS.sort, sv=r=>key==='flags'?r.flags.length:r[key]==null?-9:r[key];
  R.sort((x,y)=>OVS.dir*((sv(x)>sv(y))-(sv(x)<sv(y)))||x.id.localeCompare(y.id));
  const fl=(r,m)=>r.flags.some(f=>f.m===m)?' class="n flagc"':' class="n"';
  const rowsHtml=R.map(r=>`<tr class="cwr ${r.flags.length?'flagged':''}" data-cw="${r.id}" tabindex="0" aria-expanded="${OVS.open===r.id}">
      <td class="mono">${OVS.open===r.id?'▾':'▸'} ${r.id}</td><td class="n">${r.cases}</td>
      <td${fl(r,'sw')}>${pct(r.sw)} <span class="ci">${r.swk}/${r.swn}</span></td><td${fl(r,'woa')}>${dec(r.woa)}</td>
      <td${fl(r,'woa')}>${r.dwoa==null?'—':(r.dwoa>=0?'+':'')+dec(r.dwoa)}</td><td${fl(r,'co')}>${pct(r.co)} <span class="ci">${r.cok}/${r.con}</span></td>
      <td>${r.flags.length?r.flags.map(f=>`<span class="alarm-tag">⚑ ${ruleT(f.rule)}</span>`).join(' '):'<span class="muted small">—</span>'}</td></tr>
    ${OVS.open===r.id?`<tr class="cwd"><td colspan="7"><div class="cwd-in">
      <div><span class="kicker">${MET[OVS.met].t} by month</span>${spark(r.id,OVS.met)}</div>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="kicker">Flags · ${plab}</span>
      ${r.flags.length?r.flags.map(f=>`<span class="small"><b>${ruleT(f.rule)}</b> — ${f.txt}</span>`).join('')+`<span class="small muted">Assigned to Office ${u} supervisor · status: open · next step: case file review of 10 recent decisions</span>`:'<span class="small muted">No rule met in this period.</span>'}</div></div></td></tr>`:''}`).join('');
  const trA=trendOf(u).map(t=>({subject:'Office '+u,rule:'Office trend · '+MET[t.m].t,value:`${fv(t.m,t.first.p)} in ${MON[t.first.i]} (baseline ${fv(t.m,t.first.p0)}), ${t.count} of 6 months`,opened:MON[t.first.i]+' 2024'}));
  const cwA=R.filter(r=>r.flags.length).map(r=>({subject:r.id,rule:r.flags.map(f=>ruleT(f.rule)).join('; '),value:r.flags.map(f=>f.txt).join('; '),opened:endLab}));
  const trA2=trendOf(u).map(t=>'trend-'+t.m), cwA2=R.filter(r=>r.flags.length).map(r=>r.id);
  const AL=[...trA.map((x,i)=>({...x,key:`${u}|${trA2[i]}|${OVS.per}`})),...cwA.map((x,i)=>({...x,key:`${u}|${cwA2[i]}|${OVS.per}`}))]
    .map((x,i)=>({...x,id:`OV-${u}-${String(i+1).padStart(3,'0')}`,st:ALST[x.key]||(ALST[x.key]={status:'open',reason:'',note:''})}));
  const cnt=k=>AL.filter(x=>x.st.status===k).length;
  const closedAll=Object.values(ALST).filter(x=>x.status==='closed');
  const stCell=x=>x.st.status==='open'?`<span class="alarm-tag">Open</span> <button class="btn sec sm" data-al="${x.key}" data-act="review">Start review</button>`
    :x.st.status==='review'?`<div class="al-form"><span class="rev-tag">In review</span>
       <select data-al="${x.key}" data-act="reason" aria-label="Closing reason for ${x.id}"><option value="">Closing reason…</option>${REASONS.map(r=>`<option ${r===x.st.reason?'selected':''}>${r}</option>`).join('')}</select>
       <input type="text" data-al="${x.key}" data-act="note" value="${x.st.note.replace(/"/g,'&quot;')}" placeholder="Note (optional)" aria-label="Note for ${x.id}">
       <button class="btn sm" data-al="${x.key}" data-act="close" ${x.st.reason?'':'disabled'}>Close alert</button></div>`
    :`<span class="closed-tag">Closed</span> <span class="small">${x.st.reason}</span>${x.st.note?`<br><span class="small muted">${x.st.note.replace(/</g,'&lt;')}</span>`:''} <button class="linkb" data-al="${x.key}" data-act="reopen">Reopen</button>`;
  app.innerHTML=`<section class="panel">
    <div class="casehead"><div style="display:flex;flex-direction:column;gap:4px"><span class="kicker">Oversight review · 2024 · simulated data</span><h2>Human oversight of eligibility decisions</h2></div></div>
    <div class="ov-filters"><div><span class="kicker">Period</span>${seg('per',Object.entries(PER).map(([k,v])=>[k,v[2]]),OVS.per)}</div>
      <div><span class="kicker">Chart metric</span>${seg('met',Object.entries(MET).map(([k,v])=>[k,v.t]),OVS.met)}</div></div>
    <div class="ov-tiles">${OFF.map(tile).join('')}</div>
    <p class="small muted">SF = switch fraction · WOA = weight of advice · CO = correct override on sentinel cases. Select an office to see its caseworkers.</p></section>

  <section class="panel"><h3>${MET[OVS.met].t} by month</h3><p class="small muted">${MET[OVS.met].d}</p>
    <div class="legend">${OFF.map(x=>`<span><span class="k" style="border-color:${OCOL[x]}"></span>Office ${x}</span>`).join('')}<span><span class="ring"></span>Trend alert (office ${u})</span><span><span class="dash"></span>Control limit (office ${u})</span></div>
    <div class="ov-chart">${trendChart()}</div></section>

  <section class="panel"><div class="casehead"><h2>Office ${u} · caseworkers · ${plab}</h2><span class="small muted">${R.filter(r=>r.flags.length).length} of ${R.length} flagged</span></div>
    <div class="tbl"><table class="cwt"><thead><tr>${cols.map(([k,l,n])=>`<th class="${n||''}"><button class="sortb" data-sort="${k}" aria-label="Sort by ${l}">${l}${OVS.sort===k?(OVS.dir<0?' ↓':' ↑'):''}</button></th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table></div>
    <p class="small muted">Caseworker IDs are pseudonymised. Correct override is based on 6–12 sentinel cases per caseworker: confirm with a case file review before any follow-up.</p>
    <details><summary class="small">Flag rules</summary><ul class="small">${RULES.map(r=>`<li><b>${r.t}.</b> ${r.d}</li>`).join('')}</ul></details></section>

  <section class="panel"><div class="casehead"><h2>Alerts · Office ${u} · ${plab}</h2><span class="small muted">${cnt('open')} open · ${cnt('review')} in review · ${cnt('closed')} closed</span></div>
    <div class="tbl"><table><thead><tr><th>ID</th><th>Opened</th><th>Subject</th><th>Rule</th><th>Value</th><th>Assigned to</th><th>Status</th></tr></thead><tbody>
    ${AL.length?AL.map(x=>`<tr><td class="mono">${x.id}</td><td class="mono">${x.opened}</td><td class="mono">${x.subject}</td><td>${x.rule}</td><td class="small">${x.value}</td><td>Office ${u} supervisor</td><td>${stCell(x)}</td></tr>`).join(''):'<tr><td colspan="7" class="muted">No alerts.</td></tr>'}
    </tbody></table></div>
    <p class="small muted">Alerts are created automatically when a flag rule is met. The assigned supervisor reviews recent case files, then closes the alert with a reason.</p></section>

  <section class="panel"><div class="casehead"><h2>Closed alerts by reason · all offices</h2><span class="small muted">${closedAll.length} closed</span></div>
    ${closedAll.length?`<div class="tbl"><table><thead><tr><th>Reason</th><th class="n">Alerts</th><th>What it suggests</th></tr></thead><tbody>${REASONS.map(r=>`<tr><td>${r}</td><td class="n">${closedAll.filter(x=>x.reason===r).length}</td><td class="small muted">${REASON_HINT[r]}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">No alerts closed yet. Closing reasons are reviewed yearly: many false alarms mean thresholds are too tight; many workload closures point to staffing, not individuals.</p>'}</section>`;
  bindTrend();
  app.querySelectorAll('.ov-pick').forEach(el=>el.onclick=()=>{OVS.off=el.dataset.off;OVS.open=null;renderOversight();});
  app.querySelectorAll('input[name=ov-per]').forEach(el=>el.onchange=()=>{OVS.per=el.value;renderOversight();});
  app.querySelectorAll('input[name=ov-met]').forEach(el=>el.onchange=()=>{OVS.met=el.value;renderOversight();});
  app.querySelectorAll('.sortb').forEach(el=>el.onclick=()=>{const k=el.dataset.sort;OVS.dir=OVS.sort===k?-OVS.dir:(k==='id'?1:-1);OVS.sort=k;renderOversight();});
  app.querySelectorAll('[data-act]').forEach(el=>{const st=ALST[el.dataset.al],a=el.dataset.act;
    if(a==='review') el.onclick=()=>{st.status='review';renderOversight();};
    if(a==='reopen') el.onclick=()=>{st.status='open';st.reason='';st.note='';renderOversight();};
    if(a==='reason') el.onchange=()=>{st.reason=el.value;renderOversight();};
    if(a==='note') el.oninput=()=>{st.note=el.value;};
    if(a==='close') el.onclick=()=>{st.status='closed';renderOversight();};});
  app.querySelectorAll('.cwr').forEach(el=>{const t=()=>{OVS.open=OVS.open===el.dataset.cw?null:el.dataset.cw;renderOversight();};
    el.onclick=t;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t();}};});
}
renderOversight();
})();
</script>
</body>
</html>
